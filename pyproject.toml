[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-scoresheet-parser"
version = "1.0.0"
description = "Structured parser for FECABA basketball scoresheets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sumula-reader contributors" }]
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0",
  "pydantic>=2.10",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10", "PyMuPDF>=1.24"]
ml = ["torch>=2.4", "torchvision>=0.19"]
jev = ["requests>=2.32"]
review = ["label-studio>=1.13"]
dev = ["pytest>=8.0"]

[project.scripts]
scoresheet-parser = "sumula_reader.cli:main"
sumula-reader = "sumula_reader.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
